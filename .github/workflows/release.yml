name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン (例: v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.version || github.ref_name }}"
          VERSION_NAME="${RAW_TAG#v}"
          # 1.2.3 -> 10203 のように versionCode を組み立てる
          MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
          VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::リリース用の署名鍵が未設定のため debug 鍵で署名します。" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.available == 'true' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        id: apk
        run: |
          SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET="MirroringCamera-${{ steps.version.outputs.name }}.apk"
          mv "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore
